# CI/CD Pipeline — Build Only
#
# Selected tools: GitHub + Azure DevOps CLI + SDD Toolkit
# Skipped stages: SonarCloud (not selected), JFrog deploy/verify (not selected)
# Artifact repository: None (no deploy/verify stages)
#
# NOTE: Azure DevOps Pipelines (azure-pipelines.yml) will be generated at Step 6
# as the primary CI/CD. This GitHub Actions workflow provides build-only CI.
#
# AUTO-TRIGGERED on push to dev branch (GitFlow strategy).
# Also supports manual workflow_dispatch trigger.

name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - dev

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Install dependencies
        run: mvn dependency:resolve -B

      - name: Build project
        run: mvn package -DskipTests -B