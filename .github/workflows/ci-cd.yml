# CI/CD Pipeline — Build Only (React + Vite)
#
# Selected tools: GitHub + Azure DevOps CLI + SDD Toolkit
# Skipped stages: SonarCloud (not selected), JFrog deploy/verify (not selected)
# Artifact repository: None (no deploy/verify stages)
#
# NOTE: Azure DevOps Pipelines (azure-pipelines.yml) is the primary CI/CD
# (created at Step 6.2). This GitHub Actions workflow provides build-only CI.
#
# AUTO-TRIGGERED on push to dev branch (GitFlow strategy).
# Also supports manual workflow_dispatch trigger.

name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
